server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Node.js distribution index (JSON)
    location = ${URL_PREFIX}/dist/index.json {
        alias /usr/share/nginx/html/dist/index.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    # Node.js distribution index (TSV for NVM)
    location = ${URL_PREFIX}/dist/index.tab {
        alias /usr/share/nginx/html/dist/index.tab;
        default_type text/tab-separated-values;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    # Node.js version directories (tarballs + SHASUMS)
    location ${URL_PREFIX}/dist/ {
        alias /usr/share/nginx/html/dist/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # Tools (NVM, fnm install files)
    location ${URL_PREFIX}/tools/ {
        alias /usr/share/nginx/html/tools/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check
    location = ${URL_PREFIX}/health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
