[project]
name = "uv-oasis"
version = "0.1.0"
description = "Drop-in offline Python mirror for uv. Serve python-build-standalone binaries seamlessly in air-gapped networks."
readme = "README.md"
license = "MIT"
authors = [
  { name = "pTaunium", email = "pTaunium@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<1",
  "tenacity~=9.1",
]

[tool.pytest]
pythonpath = ['.']

[tool.coverage.run]
source = ["uv_oasis", "build"]
